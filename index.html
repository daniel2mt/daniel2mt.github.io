<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<script>try{var t=JSON.parse(localStorage.getItem('rc_theme')||'"system"');document.documentElement.dataset.theme=(t==='light'||(t==='system'&&matchMedia('(prefers-color-scheme: light)').matches))?'light':'dark'}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rewards Converter</title>
<style>
:root{color-scheme:dark;--bg:#060a13;--text:#f3f6ff;--muted:#97a5c0;--green:#4fe0a6;--blue:#4a86e0;--grad:linear-gradient(135deg,#4a86e0,#4fe0a6);--g1:rgba(255,255,255,.13);--g2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.17);--hi:rgba(255,255,255,.32);--shd:rgba(0,0,0,.42);--ink:rgba(0,0,0,.26);--onacc:#04141c;--b1:#2352c4;--b2:#0f9d7a;--b3:#5b3fc4;--bo:.55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{color-scheme:light;--bg:#e8eff9;--text:#0e1a2e;--muted:#58688a;--green:#0b9f6e;--blue:#2f6fd0;--grad:linear-gradient(135deg,#2f6fd0,#0b9f6e);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.4);--edge:rgba(255,255,255,.95);--hi:#fff;--shd:rgba(40,70,120,.2);--ink:rgba(14,26,46,.07);--onacc:#fff;--b1:#8ab6ff;--b2:#86ecc8;--b3:#c9b0ff;--bo:.9}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;position:relative;isolation:isolate;background:var(--bg);color:var(--text);font-family:"SF Pro Display",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;opacity:var(--bo);background:radial-gradient(46% 34% at 12% 8%,var(--b1),transparent 72%),radial-gradient(40% 34% at 92% 38%,var(--b2),transparent 72%),radial-gradient(46% 40% at 28% 98%,var(--b3),transparent 72%)}
.app{max-width:520px;margin:0 auto;padding:14px 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.card,.hb,.ib,.chip,.pill,.toast,.seg{background:linear-gradient(145deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid var(--edge);box-shadow:0 8px 30px var(--shd),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.05)}
.chip,.pill,.seg{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 var(--hi),0 2px 8px var(--shd)}
.card{position:relative;overflow:hidden;border-radius:30px;padding:22px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 0% 0%,rgba(255,255,255,.16),transparent 55%)}
.card>*{position:relative}
.hb{width:44px;height:44px;border-radius:50%;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib{width:40px;height:40px;border-radius:14px;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s}
.ib.sm{width:34px;height:34px;border-radius:12px}
.hb:active,.ib:active{transform:scale(.93)}
.hb.on,.hb:hover,.ib:hover{color:var(--green)}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px) scale(.985)}}
label{display:block;font-size:.78rem;letter-spacing:.02em;color:var(--muted);margin:0 0 8px}
.field{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--edge);border-radius:20px;padding:0 14px;box-shadow:inset 0 2px 8px var(--ink);transition:.2s}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 4px rgba(79,224,166,.16),inset 0 2px 8px var(--ink)}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;padding:15px 0;font-variant-numeric:tabular-nums}
.field span{color:var(--muted);font-size:.9rem}
.field.sm{margin-bottom:16px}.field.sm input{font-size:1.15rem;padding:12px 0}
.x{background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:6px;border-radius:10px;transition:.2s}
.x:hover{color:var(--text)}
.mic.rec{color:var(--green);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:8px 14px;border-radius:999px;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer;transition:.2s}
.chip:hover{color:var(--green)}
.chip i{font-style:normal;font-size:.72rem;color:var(--green);margin-left:6px}
.sug{margin-top:12px;font-size:.75rem;color:var(--muted)}.sug .chips{margin-top:6px}
.heard{margin-top:12px;font-size:.85rem;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.top label{margin:0}
.pill{display:flex;align-items:center;gap:6px;color:var(--muted);font:inherit;font-size:.8rem;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.2s}
.pill:hover,.pill.on{color:var(--green)}
.res{margin:22px 0 18px;padding:20px;border-radius:24px;background:linear-gradient(135deg,rgba(74,134,224,.26),rgba(79,224,166,.2));border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 0 40px rgba(79,224,166,.12)}
.lbl{font-size:.78rem;color:var(--muted)}
.val{font-size:clamp(2.3rem,11vw,3.3rem);font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.035em;font-variant-numeric:tabular-nums;word-break:break-word;margin:6px 0;filter:drop-shadow(0 0 16px rgba(79,224,166,.25))}
.rate{font-size:.8rem;color:var(--muted)}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:var(--grad);color:var(--onacc);font:inherit;font-weight:650;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px rgba(79,224,166,.22);transition:.2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
.btn.ghost{background:linear-gradient(145deg,var(--g1),var(--g2));color:var(--text);border-color:var(--edge);box-shadow:inset 0 1px 0 var(--hi)}
.btn.done{background:#bbf7d0;color:#04141c}
.row{display:grid;gap:10px;margin-top:16px}
.head{display:flex;justify-content:space-between;align-items:center;margin:4px 6px 12px}
h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;padding:6px}
.link:hover{color:var(--text)}
.list{padding:6px 20px}
.it{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--ink)}
.it:last-child{border:0}
.it small{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
.g{color:var(--green);font-weight:650;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:26px 0}
.cur{display:flex;justify-content:space-between;gap:8px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--ink);font-size:.9rem;color:var(--muted)}
.cur b{color:var(--green)}
.prev{padding:13px 15px;border-radius:16px;background:var(--ink);color:var(--muted);font-size:.9rem}
.prev b{color:var(--text)}.prev small{display:block;margin-top:4px}
.note{text-align:center;color:var(--muted);font-size:.75rem;margin-top:18px}
#v-set .card+.card{margin-top:12px}
.fxh,.fxr{display:grid;grid-template-columns:1fr 46px 46px;gap:12px;align-items:center}
.fxh{color:var(--muted);font-size:.75rem;margin-bottom:8px;text-align:center}
.fxh span:first-child{text-align:left;color:var(--text);font-size:.95rem;font-weight:600}
.fxr{padding:9px 0;border-top:1px solid var(--ink);font-size:.9rem}
.tgl{width:46px;height:28px;border-radius:99px;border:1px solid var(--edge);background:var(--ink);position:relative;cursor:pointer;transition:.25s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:linear-gradient(#fff,#dfe7f5);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:.25s cubic-bezier(.3,1.3,.5,1)}
.tgl[aria-checked=true]{background:var(--grad);border-color:rgba(255,255,255,.4)}
.tgl[aria-checked=true]::after{left:20px}
.seg{display:flex;gap:4px;margin-top:4px;padding:4px;border-radius:16px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:.85rem;padding:9px;border-radius:12px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--grad);color:var(--onacc);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:8px;color:var(--text);padding:11px 18px;border-radius:999px;font-size:.9rem;transition:.3s;z-index:20}
.toast svg{color:var(--green)}.toast.on{opacity:1;transform:translate(-50%,0)}
*{-webkit-tap-highlight-color:transparent}
button{outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="hb" id="bh" aria-label="Histórico" data-i="clock"></button>
  <button class="hb" id="bs" aria-label="Configurações" data-i="dots"></button>
</header>

<section id="v-home" class="view">
  <div class="card">
    <div class="top"><label for="pts" id="lin">Pontos do Microsoft Rewards</label><button class="pill" id="swap" aria-label="Inverter conversão"><span data-i="swap" data-s="16"></span>Inverter</button></div>
    <div class="field">
      <input id="pts" inputmode="numeric" autocomplete="off" placeholder="0">
      <button class="x mic" id="mic" aria-label="Falar os pontos" data-i="mic"></button>
      <button class="x" id="clr" aria-label="Limpar campo" data-i="x" data-s="18" hidden></button>
      <span id="unit">pts</span>
    </div>
    <div class="heard" id="heard" hidden></div>
    <div class="chips" id="chips"></div>
    <div class="sug" id="sug" hidden>Mais usados por você<div class="chips" id="chips2"></div></div>
    <div class="res">
      <div class="lbl" id="lres">Valor em reais</div>
      <div class="val" id="val" aria-live="polite">R$ 0,00</div>
      <div class="rate" id="rate"></div>
    </div>
    <button class="btn" id="cp"><span data-i="copy" data-s="18"></span> Copiar resultado</button>
  </div>
</section>

<section id="v-hist" class="view" hidden>
  <div class="head"><h2>Histórico</h2><button class="link" id="hclr">Limpar</button></div>
  <div class="card list" id="hl"></div>
</section>

<section id="v-set" class="view" hidden>
  <div class="head"><h2>Taxa de conversão</h2></div>
  <div class="card">
    <div class="cur"><span>Cotação atual</span><b id="cur"></b></div>
    <label for="sp">Pontos de referência</label>
    <div class="field sm"><input id="sp" inputmode="numeric" autocomplete="off"><span>pts</span></div>
    <label for="sb">Valor correspondente em reais</label>
    <div class="field sm"><span>R$</span><input id="sb" inputmode="decimal" autocomplete="off"></div>
    <div class="prev" id="prev"></div>
    <div class="row">
      <button class="btn" id="save">Salvar alterações</button>
      <button class="btn ghost" id="reset">Restaurar configuração padrão</button>
    </div>
  </div>
  <div class="card"><div class="fxh"><span>Aparência</span></div><div class="seg" id="seg"><button data-t="system">Sistema</button><button data-t="light">Claro</button><button data-t="dark">Escuro</button></div></div>
  <div class="card" id="fx"></div>
  <div class="card"><div class="fxh"><span>Intensidade da vibração</span></div><div class="seg" id="vseg"><button data-v="20">Leve</button><button data-v="35">Média</button><button data-v="60">Forte</button></div><div class="row"><button class="btn ghost" id="vtest">Testar vibração</button></div><p class="note" id="vmsg"></p></div>
  <p class="note" id="note">Seus dados ficam salvos apenas neste navegador.</p>
</section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- Ícones ---------- */
const P={
coin:'<circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M9.5 9.5h3.8a1.7 1.7 0 0 1 0 3.4h-2.6a1.7 1.7 0 0 0 0 3.4h3.8"/>',
clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
check:'<path d="M20 6 9 17l-5-5"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
swap:'<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
back:'<path d="m15 18-6-6 6-6"/>',
dots:'<circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/>',
pause:'<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>',
mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>'};
const I=(d,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',I(P[e.dataset.i],+e.dataset.s||20)));

/* ---------- Armazenamento ---------- */
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]??null)}catch(e){return mem[k]??null}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- Lógica de conversão ---------- */
const DEF={pts:5165,brl:30};
const okRate=r=>!!r&&r.pts>0&&r.brl>0&&isFinite(r.pts)&&isFinite(r.brl);
// resultado em centavos: pontos × valor de referência ÷ pontos de referência
const cents=(p,r)=>okRate(r)&&p>=0?Math.round(p*Math.round(r.brl*100)/r.pts):null;
const nf=n=>n.toLocaleString('pt-BR');
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}).replace(/\u00a0/g,' ');
const rateTxt=r=>`${nf(r.pts)} pts = ${brl(Math.round(r.brl*100))}`;
const fdate=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});

/* ---------- Estado ---------- */
const saved=store.get('rc_rate');
let rate=okRate(saved)?{pts:saved.pts,brl:saved.brl}:{...DEF};
let hist=(store.get('rc_hist')||[]).filter(h=>h&&isFinite(h.p)&&isFinite(h.c)&&isFinite(h.t)).slice(0,50);
let pts=0,timer,cur='home',mode='pts',rc=0;
const $=s=>document.querySelector(s);

/* ---------- Modo app (APK / instalado): esconde o aviso de dados ---------- */
const inApp=store.get('rc_app')===true||(document.referrer||'').startsWith('android-app://')||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
if(inApp)store.set('rc_app',true);
$('#note').hidden=inApp;

/* ---------- Sons (sintetizados, sem arquivos) ---------- */
let AC,RV,NB;
// categoria de cada som, rótulos e padrões (1 = ligado)
const SG={micOn:'mic',micOff:'mic',err:'err',done:'done',tap:'chips',copy:'copy',nav:'menus',back:'menus',swap:'swap',ok:'save',reset:'save',clear:'clear'};
const GS={mic:'micOn',err:'err',done:'done',chips:'tap',copy:'copy',menus:'nav',swap:'swap',save:'ok',clear:'clear'};
const GR=[['mic','Microfone: ao tocar'],['err','Erro de reconhecimento'],['done','Fim da fala'],['chips','Atalhos (10 mil, 20 mil…)'],['copy','Copiar resultado'],['menus','Histórico, menu e voltar'],['swap','Inverter'],['save','Salvar e restaurar'],['clear','Limpar']];
const DEFP={s:{mic:1,err:1,done:1,chips:1,copy:1,menus:0,swap:0,save:0,clear:0},h:{mic:1,err:1,done:0,chips:1,copy:1,menus:0,swap:0,save:0,clear:0}};
const sv=store.get('rc_pref');
const pref={s:{...DEFP.s,...(sv&&sv.s)},h:{...DEFP.h,...(sv&&sv.h)}};
function renderFx(){
  $('#fx').innerHTML='<div class="fxh"><span>Sons e vibração</span><span>Som</span><span>Vibr.</span></div>'+GR.map(([k,l])=>`<div class="fxr"><span>${l}</span>${['s','h'].map(t=>`<button class="tgl" role="switch" aria-checked="${!!pref[t][k]}" data-t="${t}" data-k="${k}" aria-label="${l}: ${t==='s'?'som':'vibração'}"></button>`).join('')}</div>`).join('');
}
$('#fx').onclick=e=>{
  const b=e.target.closest('.tgl');if(!b)return;
  const {t,k}=b.dataset;pref[t][k]=pref[t][k]?0:1;
  store.set('rc_pref',pref);b.setAttribute('aria-checked',!!pref[t][k]);
  if(pref[t][k])snd(GS[k]); // pré-visualiza ao ligar
};
renderFx();
// vibração: duração em ms (o Android não permite ajustar a força, só o tempo)
let vms=store.get('rc_vib')||35;
function vib(){try{return navigator.vibrate?navigator.vibrate(vms):null}catch(e){return null}}
function markV(){document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',+b.dataset.v===vms))}
$('#vseg').onclick=e=>{const b=e.target.closest('button');if(!b)return;vms=+b.dataset.v;store.set('rc_vib',vms);markV();vib()};
$('#vtest').onclick=()=>{
  const r=vib();
  $('#vmsg').textContent=r===null?'Este navegador não suporta vibração (o iPhone, por exemplo, não suporta).':r?'Vibração enviada. Se você não sentiu, confira o modo silencioso e a vibração de toque nas configurações do celular, ou abra o link direto no Chrome.':'O navegador bloqueou a vibração aqui. Abra o link direto no Chrome e toque de novo.';
};
markV();
// tema: sistema / claro / escuro
let theme=store.get('rc_theme')||'system';
const mq=matchMedia('(prefers-color-scheme: light)');
function applyTheme(){
  const l=theme==='light'||(theme==='system'&&mq.matches);
  document.documentElement.dataset.theme=l?'light':'dark';
  document.querySelector('meta[name="theme-color"]').content=l?'#e8eff9':'#060a13';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===theme));
}
if(mq.addEventListener)mq.addEventListener('change',applyTheme);
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;theme=b.dataset.t;store.set('rc_theme',theme);applyTheme()};
applyTheme();
// [frequência, duração, onda, volume, atraso, frequência final, lowpass, ataque, reverb]
const SND={
 tap:[[1500,.04,'sine',.05]],
 nav:[[2400,.012,'noise',.02,0,2400],[1250,.04,'sine',.035,0,0,0,.003]],
 back:[[1900,.012,'noise',.018,0,1900],[900,.04,'sine',.03,0,0,0,.003]],
 brand:[[2100,.012,'noise',.02,0,2100],[760,.05,'sine',.04,0,0,0,.003],[1140,.04,'sine',.015,0,0,0,.003]],
 swap:[[440,.17,'sine',.036,0,800]],
 copy:[[880,.07,'sine',.07],[1320,.12,'sine',.07,.07]],
 micOn:[[440,.08,'sine',.08],[660,.08,'sine',.08,.07],[990,.16,'sine',.08,.14]],
 micOff:[[990,.07,'sine',.07],[660,.07,'sine',.07,.07],[440,.16,'sine',.07,.14]],
 done:[[660,.08,'triangle',.07],[880,.08,'triangle',.07,.08],[1320,.18,'triangle',.07,.16]],
 ok:[[740,.08,'sine',.07],[1110,.14,'sine',.07,.08]],
 reset:[[600,.2,'sine',.06,0,360]],
 clear:[[300,.1,'triangle',.07,0,200]],
 err:[[200,.14,'square',.035],[160,.18,'square',.035,.13]]
};
function audioInit(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const sr=AC.sampleRate,L=Math.floor(sr*1.1),rb=AC.createBuffer(2,L,sr);
  for(let c=0;c<2;c++){const d=rb.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
  RV=AC.createConvolver();RV.buffer=rb;
  const wg=AC.createGain();wg.gain.value=.45;RV.connect(wg);wg.connect(AC.destination);
  NB=AC.createBuffer(1,sr,sr);const nd=NB.getChannelData(0);for(let i=0;i<sr;i++)nd[i]=Math.random()*2-1;
}
function snd(n){
  const g=SG[n];
  if(pref.h[g])vib();
  if(!pref.s[g])return;
  try{
    if(!AC)audioInit();
    if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;
    for(const [f,d,w,v,dl=0,to,lp,at=.01,rv] of SND[n]){
      const t=t0+dl,g=AC.createGain();let s,out;
      if(w==='noise'){
        s=AC.createBufferSource();s.buffer=NB;
        out=AC.createBiquadFilter();out.type='bandpass';out.Q.value=1.1;
        out.frequency.setValueAtTime(f,t);if(to)out.frequency.exponentialRampToValueAtTime(to,t+d);
        s.connect(out);
      }else{
        s=AC.createOscillator();s.type=w;s.frequency.setValueAtTime(f,t);
        if(to)s.frequency.exponentialRampToValueAtTime(to,t+d);
        out=s;
        if(lp){const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;s.connect(l);out=l}
      }
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      out.connect(g);g.connect(AC.destination);if(rv)g.connect(RV);
      s.start(t);s.stop(t+d+.05);
    }
  }catch(e){}
}

/* ---------- Utilidades de UI ---------- */
let tt;
function toast(msg,err){const t=$('#toast');t.innerHTML=(err?'':I(P.check,16))+'<span></span>';t.lastChild.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}
async function copy(txt){
  try{await navigator.clipboard.writeText(txt);return true}
  catch(e){try{const a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}
}
// máscara de milhares mantendo o cursor no lugar
function maskInt(el){
  const pos=el.selectionStart??el.value.length;
  const before=el.value.slice(0,pos).replace(/\D/g,'').length;
  const d=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,12);
  el.value=d?nf(+d):'';
  if(document.activeElement===el){let i=0,c=0;while(i<el.value.length&&c<before){if(/\d/.test(el.value[i]))c++;i++}try{el.setSelectionRange(i,i)}catch(e){}}
  return d?+d:0;
}

/* ---------- Calculadora ---------- */
const needPts=c=>okRate(rate)?Math.ceil(c*rate.pts/Math.round(rate.brl*100)-1e-9):null;
const brlNum=c=>(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function result(){return mode==='pts'?brl(cents(pts,rate)??0):nf(needPts(rc)||0)+' pts'}
function update(){
  const has=(mode==='pts'?pts:rc)>0;
  $('#val').textContent=result();
  $('#rate').textContent='Taxa atual: '+rateTxt(rate);
  $('#cur').textContent=rateTxt(rate);
  $('#clr').hidden=!has;
  $('#cp').disabled=!has;
}
function record(){
  clearTimeout(timer);
  const p=mode==='pts'?pts:needPts(rc),c=mode==='pts'?cents(pts,rate):rc;
  if(!(p>0)||c==null)return;
  const h=hist[0];
  if(h&&h.p===p&&h.c===c&&(h.m||'pts')===mode)return;
  hist.unshift({p,c,t:Date.now(),m:mode});
  hist=hist.slice(0,50);
  if(mode==='pts')bump(p);
  store.set('rc_hist',hist);
  renderHist();
}
function maskBRL(el){
  const pos=el.selectionStart??el.value.length;
  const before=el.value.slice(0,pos).replace(/[^\d,]/g,'').length;
  const v=el.value.replace(/[^\d,]/g,''),i=v.indexOf(',');
  const ip=(i<0?v:v.slice(0,i)).replace(/^0+(?=\d)/,'').slice(0,11),dp=i<0?null:v.slice(i+1).replace(/,/g,'').slice(0,2);
  let out=ip?nf(+ip):(dp!==null?'0':'');
  if(dp!==null)out+=','+dp;
  el.value=out;
  if(document.activeElement===el){let k=0,c=0;while(k<out.length&&c<before){if(/[\d,]/.test(out[k]))c++;k++}try{el.setSelectionRange(k,k)}catch(e){}}
  return (+ip||0)*100+(dp?+dp.padEnd(2,'0'):0);
}
function onPts(){const el=$('#pts');if(mode==='pts')pts=maskInt(el);else rc=maskBRL(el);update();clearTimeout(timer);timer=setTimeout(record,1500)}
$('#pts').addEventListener('input',onPts);
$('#pts').addEventListener('blur',record);
$('#pts').addEventListener('keydown',e=>{if(e.key==='Enter')record()});
$('#clr').onclick=()=>{snd('clear');$('#pts').value='';onPts();$('#pts').focus()};
function setPts(n,sched=true){
  if(mode==='pts'){pts=n;$('#pts').value=n?nf(n):''}else{rc=n;$('#pts').value=n?brlNum(n):''}
  update();clearTimeout(timer);if(sched)timer=setTimeout(record,1500);
}
function setMode(m){
  mode=m;const b=m==='brl';
  $('#lin').textContent=b?'Valor em reais':'Pontos do Microsoft Rewards';
  $('#lres').textContent=b?'Pontos necessários':'Valor em reais';
  $('#unit').textContent=b?'R$':'pts';
  $('#pts').inputMode=b?'decimal':'numeric';
  $('#pts').placeholder=b?'0,00':'0';
  $('#swap').classList.toggle('on',b);
  renderChips();
}
$('#swap').onclick=()=>{
  snd('swap');clearTimeout(timer);
  const v=mode==='pts'?cents(pts,rate):needPts(rc); // o resultado vira a nova entrada
  setMode(mode==='pts'?'brl':'pts');
  setPts(v>0?v:0,false);
};

/* ---------- Sugestões ---------- */
const FIXED=[10000,20000,30000,40000,50000,100000,1000000],BRLQ=[10,20,30,50,100,200];
let freq=store.get('rc_freq');
if(!freq||typeof freq!=='object'||Array.isArray(freq))freq={};
for(const k of Object.keys(freq))if(!(+k>0)||!(freq[k]>0))delete freq[k];
function renderChips(){
  const p=mode==='pts';
  const chip=n=>`<button class="chip" data-v="${n}">${p?nf(n):'R$ '+nf(n)}${p&&freq[n]>=2?`<i title="${freq[n]} conversões">×${freq[n]}</i>`:''}</button>`;
  $('#chips').innerHTML=(p?FIXED:BRLQ).map(chip).join('');
  const top=p?Object.keys(freq).map(Number).filter(n=>!FIXED.includes(n)&&freq[n]>=2).sort((a,b)=>freq[b]-freq[a]||b-a).slice(0,4):[];
  $('#sug').hidden=!top.length;
  $('#chips2').innerHTML=top.map(chip).join('');
}
function bump(n){
  freq[n]=(freq[n]||0)+1;
  const ks=Object.keys(freq);
  if(ks.length>60)ks.filter(k=>k!=n).sort((a,b)=>freq[a]-freq[b]).slice(0,ks.length-60).forEach(k=>delete freq[k]);
  store.set('rc_freq',freq);renderChips();
}
$('#chips').onclick=$('#chips2').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;snd('tap');$('#pts').value=b.dataset.v;onPts()};
renderChips();

/* ---------- Voz ---------- */
const W={zero:0,um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
function speechToNum(t){
  t=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/(\d)[\s.](?=\d{3}\b)/g,'$1');
  let total=0,c=0,found=false;
  for(const w of t.match(/\d+(?:,\d+)?|[a-z]+/g)||[]){
    if(/^\d/.test(w)){c+=parseFloat(w.replace(',','.'));found=true}
    else if(Object.hasOwn(W,w)){c+=W[w];found=true}
    else if(w==='mil'){total+=(c||1)*1e3;c=0;found=true}
    else if(w==='milhao'||w==='milhoes'){total+=(c||1)*1e6;c=0;found=true}
  }
  return found?Math.min(Math.round(total+c),999999999999):null;
}
function speechToCents(t){
  const s=t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/(\d)[\s.](?=\d{3}\b)/g,'$1');
  const d=s.match(/(\d+)[,.](\d{1,2})(?!\d)/);
  if(d)return +d[1]*100+ +d[2].padEnd(2,'0');
  const [a,b]=s.split(/\breais?\b/);
  let r=null,c=null;
  if(b===undefined){if(/centavo/.test(s))c=speechToNum(s);else r=speechToNum(s)}
  else{r=speechToNum(a);c=speechToNum(b)}
  if(r==null&&c==null)return null;
  return Math.min((r||0)*100+(c||0),99999999999);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,on=false;
function setMic(v){on=v;const m=$('#mic');m.classList.toggle('rec',v);m.innerHTML=I(v?P.pause:P.mic,20);m.setAttribute('aria-label',v?'Pausar e usar o que foi dito':'Falar')}
$('#mic').onclick=()=>{
  if(on){snd('micOff');rec.stop();return} // pausa: encerra agora e usa o que já foi ouvido
  if(!SR){snd('err');toast('Este navegador não suporta entrada por voz. Tente no Chrome ou no Safari.',1);return}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;
  const h=$('#heard');let got=null,err=0;
  rec.onstart=()=>{snd('micOn');setMic(true);h.hidden=false;h.textContent=mode==='pts'?'Ouvindo… diga a quantidade de pontos':'Ouvindo… diga o valor em reais'};
  rec.onresult=e=>{
    const t=Array.from(e.results,r=>r[0].transcript).join(' ');
    h.textContent='“'+t.trim()+'”';
    const n=mode==='pts'?speechToNum(t):speechToCents(t);
    if(n!=null){got=n;setPts(n,false)}
  };
  rec.onerror=e=>{err=1;snd('err');toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Permita o microfone para falar':'Não consegui ouvir. Tente de novo.',1)};
  rec.onend=()=>{
    setMic(false);
    if(got!=null){snd('done');record();setTimeout(()=>{if(!on)h.hidden=true},3000)}
    else if(err)h.hidden=true;
    else{snd('micOff');h.textContent=mode==='pts'?'Não entendi o número. Tente algo como “dez mil pontos”.':'Não entendi o valor. Tente algo como “trinta reais”.'}
  };
  try{rec.start()}catch(e){snd('err');toast('Não foi possível iniciar o microfone',1)}
};
$('#cp').onclick=async()=>{
  if(!((mode==='pts'?pts:rc)>0))return;
  const ok=await copy(result());
  if(!ok){snd('err');toast('Não foi possível copiar',1);return}
  snd('copy');record();
  const b=$('#cp');b.classList.add('done');b.innerHTML=I(P.check,18)+' Copiado';
  toast('Resultado copiado');
  setTimeout(()=>{b.classList.remove('done');b.innerHTML=I(P.copy,18)+' Copiar resultado'},1600);
};

/* ---------- Histórico ---------- */
function renderHist(){
  const el=$('#hl');
  $('#hclr').hidden=!hist.length;
  if(!hist.length){el.innerHTML='<div class="empty">Nenhuma conversão registrada ainda.</div>';return}
  el.innerHTML=hist.map((h,i)=>{const b=h.m==='brl';return `<div class="it"><div><b>${b?brl(h.c):nf(h.p)+' pts'}</b><small>${fdate(h.t)}${b?' · reais → pontos':''}</small></div><div class="g">${b?nf(h.p)+' pts':brl(h.c)}</div><button class="ib sm" data-c="${i}" aria-label="Copiar resultado">${I(P.copy,16)}</button></div>`}).join('');
}
$('#hl').addEventListener('click',async e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  const h=hist[+b.dataset.c];
  {const ok=await copy(h.m==='brl'?nf(h.p)+' pts':brl(h.c));snd(ok?'copy':'err');toast(ok?'Resultado copiado':'Não foi possível copiar',!ok)}
});
let arm;
$('#hclr').onclick=e=>{
  const b=e.currentTarget;
  if(!arm){b.textContent='Toque para confirmar';arm=setTimeout(()=>{arm=0;b.textContent='Limpar'},3000);return}
  clearTimeout(arm);arm=0;b.textContent='Limpar';
  snd('clear');hist=[];store.set('rc_hist',hist);renderHist();toast('Histórico limpo');
};

/* ---------- Configurações ---------- */
function parseBRL(s){
  s=s.replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  if(!s.includes(',')&&/^\d+\.\d{1,2}$/.test(s))return +s;
  return +s.replace(/\./g,'').replace(',','.');
}
const fmtBRLField=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function checkSet(){
  const r={pts:+($('#sp').value.replace(/\D/g,'')||0),brl:Math.round(parseBRL($('#sb').value)*100)/100};
  const ok=r.pts>0&&r.brl>0&&r.brl<=1e6&&isFinite(r.brl);
  $('#save').disabled=!ok;
  $('#prev').innerHTML=ok?`Nova taxa: <b>${rateTxt(r)}</b><small>1.000 pts ≈ ${brl(cents(1000,r))}</small>`:'Informe valores maiores que zero nas duas caixas.';
  return ok?r:null;
}
function fillSet(){$('#sp').value=nf(rate.pts);$('#sb').value=fmtBRLField(rate.brl);checkSet()}
$('#sp').addEventListener('input',()=>{maskInt($('#sp'));checkSet()});
$('#sb').addEventListener('input',checkSet);
$('#sb').addEventListener('blur',()=>{const b=parseBRL($('#sb').value);if(b>0&&isFinite(b))$('#sb').value=fmtBRLField(b);checkSet()});
$('#save').onclick=()=>{
  const r=checkSet();if(!r)return;
  rate=r;store.set('rc_rate',rate);update();
  const b=$('#save');b.classList.add('done');b.textContent='Salvo!';
  snd('ok');toast('Alterações salvas');
  setTimeout(()=>{b.classList.remove('done');b.textContent='Salvar alterações'},1500);
};
$('#reset').onclick=()=>{rate={...DEF};store.set('rc_rate',rate);fillSet();update();snd('reset');toast('Configuração padrão restaurada')};

/* ---------- Navegação ---------- */
function show(v){
  cur=v;
  $('#bh').innerHTML=I(v==='home'?P.clock:P.back,20);$('#bh').setAttribute('aria-label',v==='home'?'Histórico':'Voltar');
  for(const k of['home','hist','set'])$('#v-'+k).hidden=k!==v;
  $('#bs').classList.toggle('on',v==='set');
  if(v==='set')fillSet();
  if(v==='hist')renderHist();
  scrollTo(0,0);
}
$('#bh').onclick=()=>{const h=cur==='home';snd(h?'nav':'back');show(h?'hist':'home')};
$('#bs').onclick=()=>{snd(cur==='set'?'back':'nav');show(cur==='set'?'home':'set')};

update();renderHist();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
